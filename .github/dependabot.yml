version: 2
updates:
  - package-ecosystem: npm
    directory: "/property-report"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Experience Builder pins these; upgrading them independently breaks the build.
      - dependency-name: "jimu-*"
      - dependency-name: "@arcgis/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # Major versions change APIs and can break the widget at runtime. Take them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
